<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0d14">
    <title>Chaos System</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0d14'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%234a9eff' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23ffc864' stroke-width='1'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23ffc864'/%3E%3Cline x1='3' y1='16' x2='29' y2='16' stroke='%234a9eff' stroke-width='0.5' opacity='0.5'/%3E%3Cline x1='16' y1='3' x2='16' y2='29' stroke='%234a9eff' stroke-width='0.5' opacity='0.5'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Экран загрузки -->
    <div id="boot-screen">
        <div class="boot-progress"><div class="boot-progress-bar"></div></div>
    </div>

    <!-- Приветственный экран -->
    <div id="welcome-screen">
        <div class="welcome-card">
            <div class="welcome-emoji" id="welcomeEmoji">👋</div>
            <div class="welcome-greeting" id="welcomeGreeting">Доброе утро</div>
            <div class="welcome-name" id="welcomeName">Гость</div>
            <div class="welcome-subtitle" id="welcomeSubtitle">—</div>
            <div class="welcome-hint">
                Нажмите на любое приложение в верхней панели или начните работать
            </div>
            <button class="welcome-btn" id="welcomeBtn">Начать работу</button>
            <div class="welcome-brand">Даже в хаосе прослеживается система</div>
        </div>
    </div>

    <!-- Menu Bar -->
    <div id="menu-bar">
        <div class="menu-left">
            <button class="app-btn" data-app="calculator">Калькулятор</button>
            <button class="app-btn" data-app="salary">Зарплата</button>
            <button class="app-btn" data-app="games">Игры</button>
            <button class="app-btn" data-app="spg">СПГ</button>
			<button class="app-btn" data-app="jsoneditor">JSON-редактор</button>
        </div>
        <div class="menu-right">
            <div class="currency-widget" id="currencyWidget">
                <div class="currency-item" data-currency="usd">
                    <span class="currency-icon">💵</span>
                    <span class="currency-code">USD</span>
                    <span class="currency-value" id="usdValue">—</span>
                </div>
                <div class="currency-item" data-currency="eur">
                    <span class="currency-icon">💶</span>
                    <span class="currency-code">EUR</span>
                    <span class="currency-value" id="eurValue">—</span>
                </div>
                <div class="currency-item" data-currency="cny">
                    <span class="currency-icon">¥</span>
                    <span class="currency-code">CNY</span>
                    <span class="currency-value" id="cnyValue">—</span>
                </div>
            </div>

            <div class="clock-container" id="clockContainer">
                <span class="menu-item" id="clock">--:--</span>
                <div class="clock-popup" id="clockPopup">
                    <div class="clock-popup-time" id="popupTime">--:--:--</div>
                    <div class="clock-popup-date" id="popupDate">—</div>
                    <div class="calendar" id="calendar"></div>
                    <div class="clock-popup-brand">Chaos System · Даже в хаосе прослеживается система</div>
                </div>
            </div>

            <button class="app-btn settings-icon-btn" data-app="settings" title="Настройки" aria-label="Настройки">
                ⚙️
            </button>

            <div class="notif-bell-container" id="notifBellContainer">
                <button class="notif-bell" id="notifBell" title="Уведомления">
                    🔔
                    <span class="notif-badge" id="notifBadge">0</span>
                </button>
                <div class="notif-center" id="notifCenter">
                    <div class="notif-center-header">
                        <span>Уведомления</span>
                        <button class="notif-clear" id="notifClear" title="Очистить всё">Очистить</button>
                    </div>
                    <div class="notif-center-list" id="notifCenterList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Рабочий стол с картой мира -->
    <div id="desktop">
        <div id="wallpaper-layer"></div>
        <canvas id="world-canvas"></canvas>
    </div>

    <!-- Контейнер всплывающих уведомлений -->
    <div id="notifications" class="notifications"></div>

    <!-- Модальное окно с графиком валюты -->
    <div class="currency-modal" id="currencyModal">
        <div class="currency-modal-content">
            <div class="currency-modal-header">
                <div class="currency-modal-title" id="currencyModalTitle">Курс USD</div>
                <button class="currency-modal-close" id="currencyModalClose">✕</button>
            </div>
            <div class="currency-modal-stats" id="currencyModalStats"></div>
            <div class="currency-modal-chart-wrapper">
                <canvas id="currencyChartCanvas"></canvas>
            </div>
            <div class="currency-modal-footer" id="currencyModalFooter">
                Период: последние 30 дней
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- ⚙️ Конфиг приложения -->
    <script>
        window.APP_CONFIG = {
            WEATHER_UNITS: 'metric',
            WEATHER_LANG: 'ru',

            // ─── Погода ────────────────────────────────────────
            // Провайдер: 'weatherapi' или 'open-meteo'
            WEATHER_PROVIDER: 'weatherapi',

            // 🔑 API-ключ WeatherAPI.com
            // Получить бесплатно: https://www.weatherapi.com/ → Sign Up → Dashboard → API Key
            // Вставь ключ МЕЖДУ кавычками. Не удаляй кавычки!
            // Пример: WEATHER_API_KEY: 'a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6',
            WEATHER_API_KEY: '6bf6a550ae614cca97b103843262509',   // ← вставь сюда свой ключ
        };
    </script>

    <!-- ⚠️ ВАЖЕН ПОРЯДОК ⚠️ -->
    <script src="windows.js"></script>
    <script src="calculator.js"></script>
    <script src="cloud.js"></script>
    <script src="salary.js"></script>
    <script src="wallpapers.js"></script>
    <script src="settings.js"></script>
    <script src="games.js"></script>
    <script src="spg.js"></script>
	<script src="json-editor.js"></script>
    <script src="world-map.js"></script>
    <script src="script.js"></script>
</body>
</html>
